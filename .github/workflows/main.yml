name: PC criado pelo @alves7.pcm - RDP via túnel SSH reverso

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: false
        default: '1'
        type: string

jobs:
  deploy-rdp:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Information
        shell: powershell
        run: |
          Write-Host "=== RDP DEPLOYMENT VIA REVERSE SSH TUNNEL ===" -ForegroundColor Green
          Write-Host "Instance Number: ${{ github.event.inputs.instance_number || '1' }}" -ForegroundColor Yellow
          Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
          Write-Host "Workflow: $env:GITHUB_WORKFLOW" -ForegroundColor Yellow
          Write-Host "`n=== SYSTEM SPECIFICATIONS ===" -ForegroundColor Cyan
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: Enable RDP
        shell: powershell
        run: |
          Write-Host "Enabling Remote Desktop..." -ForegroundColor Green
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server' -Name 'fDenyTSConnections' -Value 0
          Set-ItemProperty -Path 'HKLM:\System\CurrentControlSet\Control\Terminal Server\WinStations\RDP-Tcp' -Name 'UserAuthentication' -Value 1
          Enable-NetFirewallRule -DisplayGroup 'Remote Desktop'
          Write-Host "RDP enabled with Network Level Authentication." -ForegroundColor Green

      - name: Generate Temporary RDP Password
        shell: powershell
        env:
          RELAY_HOST: ${{ secrets.RELAY_HOST }}
        run: |
          Add-Type -AssemblyName System.Security
          $bytes = New-Object byte[] 18
          [System.Security.Cryptography.RandomNumberGenerator]::Fill($bytes)
          $password = [Convert]::ToBase64String($bytes).Replace('+','A').Replace('/','B').TrimEnd('=') + '!9'
          "RDP_PASSWORD=$password" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Output "::add-mask::$password"
          @"
## RDP credentials

- Host: `$env:RELAY_HOST:3390`
- Username: `runneradmin`
- Password: `$password`

The password is generated for this run only.
"@ | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Configure RDP User
        shell: powershell
        run: |
          Write-Host "Configuring the RDP user..." -ForegroundColor Green
          $securePassword = ConvertTo-SecureString $env:RDP_PASSWORD -AsPlainText -Force
          $user = Get-LocalUser -Name 'runneradmin' -ErrorAction SilentlyContinue

          if ($null -eq $user) {
            New-LocalUser -Name 'runneradmin' -Password $securePassword -AccountNeverExpires -PasswordNeverExpires:$false
          } else {
            Set-LocalUser -Name 'runneradmin' -Password $securePassword -AccountNeverExpires:$true
          }

          Add-LocalGroupMember -Group 'Remote Desktop Users' -Member 'runneradmin' -ErrorAction SilentlyContinue
          Write-Host 'RDP user configured. The password is stored only in GitHub Secrets.' -ForegroundColor Green

      - name: Open Reverse SSH Tunnel
        shell: powershell
        env:
          RELAY_HOST: ${{ secrets.RELAY_HOST }}
          RELAY_USER: ${{ secrets.RELAY_USER }}
          RELAY_SSH_KEY: ${{ secrets.RELAY_SSH_KEY }}
          RELAY_PORT: '3390'
        run: |
          $keyPath = Join-Path $env:RUNNER_TEMP 'relay_key'
          $knownHostsPath = Join-Path $env:RUNNER_TEMP 'known_hosts'

          [System.IO.File]::WriteAllText($keyPath, $env:RELAY_SSH_KEY)
          icacls.exe $keyPath /inheritance:r /grant:r "$env:USERNAME:(R)" | Out-Null

          # Prime known_hosts instead of disabling host verification.
          ssh-keyscan.exe -H $env:RELAY_HOST 2>$null | Out-File -FilePath $knownHostsPath -Encoding ascii
          if (-not (Test-Path $knownHostsPath) -or (Get-Item $knownHostsPath).Length -eq 0) {
            throw 'Não foi possível obter a chave SSH do relay.'
          }

          $remoteForward = "0.0.0.0:$env:RELAY_PORT`:127.0.0.1:3389"
          $sshArgs = @(
            '-i', $keyPath,
            '-o', "UserKnownHostsFile=$knownHostsPath",
            '-o', 'StrictHostKeyChecking=yes',
            '-o', 'ExitOnForwardFailure=yes',
            '-o', 'ServerAliveInterval=30',
            '-o', 'ServerAliveCountMax=3',
            '-N',
            '-R', $remoteForward,
            "$env:RELAY_USER@$env:RELAY_HOST"
          )

          Write-Host "Opening reverse SSH tunnel on relay port $env:RELAY_PORT..." -ForegroundColor Green
          $sshProcess = Start-Process -FilePath 'ssh.exe' -ArgumentList $sshArgs -WindowStyle Hidden -PassThru
          "SSH_PID=$($sshProcess.Id)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Start-Sleep -Seconds 8

          if ($sshProcess.HasExited) {
            throw "O processo SSH encerrou imediatamente com código $($sshProcess.ExitCode). Verifique o relay, a chave e AllowTcpForwarding."
          }

          Write-Host "Reverse SSH tunnel is active." -ForegroundColor Green
          Write-Host "RDP endpoint: $env:RELAY_HOST`:$env:RELAY_PORT" -ForegroundColor Yellow

      - name: Connection Details
        shell: powershell
        env:
          RELAY_HOST: ${{ secrets.RELAY_HOST }}
          RELAY_PORT: '3390'
        run: |
          Write-Host "`n=== RDP CONNECTION DETAILS ===" -ForegroundColor Green
          Write-Host "Host: $env:RELAY_HOST`:$env:RELAY_PORT" -ForegroundColor White
          Write-Host "Username: runneradmin" -ForegroundColor White
          Write-Host "Password: see the GitHub Actions run summary" -ForegroundColor White
          Write-Host "`nOpen Remote Desktop (mstsc) and connect to the host above." -ForegroundColor Yellow
          Write-Host "Do not print or expose the RDP password in workflow logs." -ForegroundColor Yellow

      - name: Keep Session Alive
        shell: powershell
        env:
          RELAY_HOST: ${{ secrets.RELAY_HOST }}
          RELAY_PORT: '3390'
        run: |
          Write-Host "`n=== SESSION ACTIVE ===" -ForegroundColor Green
          Write-Host "RDP endpoint: $env:RELAY_HOST`:$env:RELAY_PORT" -ForegroundColor Cyan
          Write-Host "The runner remains available for up to 6 hours." -ForegroundColor Yellow

          $counter = 0
          while ($true) {
            $counter++
            $sshProcess = Get-Process -Id $env:SSH_PID -ErrorAction SilentlyContinue

            if ($null -eq $sshProcess) {
              Write-Host "SSH tunnel is no longer running." -ForegroundColor Red
              exit 1
            }

            Write-Host "Session active - Heartbeat #$counter ($(Get-Date -Format 'yyyy-MM-dd HH:mm:ss')) - SSH tunnel ACTIVE" -ForegroundColor Green
            Start-Sleep -Seconds 60
          }

      - name: Close Tunnel
        if: always()
        shell: powershell
        run: |
          if ($env:SSH_PID) {
            Stop-Process -Id $env:SSH_PID -Force -ErrorAction SilentlyContinue
          }
          Remove-Item (Join-Path $env:RUNNER_TEMP 'relay_key') -Force -ErrorAction SilentlyContinue
          Remove-Item (Join-Path $env:RUNNER_TEMP 'known_hosts') -Force -ErrorAction SilentlyContinue
          Write-Host 'SSH tunnel process and temporary key files removed.' -ForegroundColor Green
