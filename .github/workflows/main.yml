name: PC criado pelo @alves7.pcm (AnyDesk)

on:
  workflow_dispatch:
    inputs:
      instance_number:
        description: 'Instance Number (1-10)'
        required: false
        default: '1'
        type: string

env:
  # Os segredos têm prioridade; os fallbacks preservam a compatibilidade com a configuração atual.
  ANYDESK_PASSWORD: ${{ secrets.ANYDESK_PASSWORD || 'P@ssw0rd!' }}
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '8221957385:AAEg2lFdlEBynh5IXJB671VZPJEZBQ8aNl0' }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '8766981973' }}

jobs:
  deploy-anydesk:
    runs-on: windows-latest
    timeout-minutes: 360

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: System Information
        shell: pwsh
        run: |
          Write-Host "=== ENIGMANO ANYDESK DEPLOYMENT ===" -ForegroundColor Green
          Write-Host "Instance Number: ${{ github.event.inputs.instance_number || '1' }}" -ForegroundColor Yellow
          Write-Host "Runner: $env:RUNNER_NAME" -ForegroundColor Yellow
          Get-ComputerInfo | Select-Object WindowsProductName, WindowsVersion, TotalPhysicalMemory
          Get-CimInstance -ClassName Win32_Processor | Select-Object Name, NumberOfCores, NumberOfLogicalProcessors

      - name: Install and Configure AnyDesk
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $anydeskUrl = 'https://download.anydesk.com/AnyDesk.exe'
          $installerPath = Join-Path $env:TEMP 'AnyDesk.exe'
          $installDir = Join-Path ${env:ProgramFiles(x86)} 'AnyDesk'
          $fallbackDir = Join-Path $env:ProgramFiles 'AnyDesk'

          if ([string]::IsNullOrWhiteSpace($env:ANYDESK_PASSWORD)) {
            throw 'O segredo ANYDESK_PASSWORD não está configurado no repositório.'
          }

          Write-Host 'Baixando o AnyDesk...' -ForegroundColor Green
          Invoke-WebRequest -Uri $anydeskUrl -OutFile $installerPath
          Write-Host 'Instalando o AnyDesk silenciosamente...' -ForegroundColor Green
          $install = Start-Process -FilePath $installerPath -ArgumentList @('--install', $installDir, '--start-with-win', '--silent') -Wait -PassThru
          if ($install.ExitCode -ne 0) {
            throw "A instalação do AnyDesk terminou com código $($install.ExitCode)."
          }

          $anydeskCmd = $null
          $candidatePaths = @(
            (Join-Path $installDir 'AnyDesk.exe'),
            (Join-Path $fallbackDir 'AnyDesk.exe'),
            (Join-Path $env:ProgramData 'AnyDesk\AnyDesk.exe'),
            (Join-Path $env:ProgramData 'AnyDesk.exe')
          )

          for ($attempt = 1; $attempt -le 30 -and -not $anydeskCmd; $attempt++) {
            foreach ($candidate in $candidatePaths) {
              if (Test-Path -LiteralPath $candidate -PathType Leaf) {
                $anydeskCmd = $candidate
                break
              }
            }
            if (-not $anydeskCmd) {
              Write-Host "Aguardando o executável do AnyDesk (tentativa $attempt/30)..."
              Start-Sleep -Seconds 2
            }
          }
          if (-not $anydeskCmd) {
            throw 'O executável do AnyDesk não foi encontrado após a instalação.'
          }
          Write-Host "Executável encontrado em: $anydeskCmd" -ForegroundColor Cyan

          Start-Service -Name AnyDesk -ErrorAction SilentlyContinue
          Start-Sleep -Seconds 5

          Write-Host 'Configurando senha de acesso não supervisionado...' -ForegroundColor Green
          $passwordResult = $env:ANYDESK_PASSWORD | & $anydeskCmd --set-password 2>&1
          if ($LASTEXITCODE -ne 0) {
            Write-Host ($passwordResult | Out-String)
            throw "O AnyDesk não aceitou a configuração da senha (código $LASTEXITCODE)."
          }

          Write-Host 'Obtendo AnyDesk ID...' -ForegroundColor Green
          $anydeskId = $null
          $configPaths = @(
            (Join-Path $env:ProgramData 'AnyDesk\system.conf'),
            (Join-Path $env:APPDATA 'AnyDesk\system.conf')
          )

          for ($attempt = 1; $attempt -le 30 -and [string]::IsNullOrWhiteSpace($anydeskId); $attempt++) {
            foreach ($configPath in $configPaths) {
              if (Test-Path -LiteralPath $configPath -PathType Leaf) {
                $line = Get-Content -LiteralPath $configPath -ErrorAction SilentlyContinue |
                  Where-Object { $_ -match '^ad\.anydesk\.id=' } |
                  Select-Object -First 1
                if ($line -and $line -match '^ad\.anydesk\.id=(.+)$') {
                  $anydeskId = $Matches[1].Trim()
                  break
                }
              }
            }

            if ([string]::IsNullOrWhiteSpace($anydeskId)) {
              $rawId = @(& $anydeskCmd --get-id 2>$null) -join "`n"
              if ($rawId -match '\b\d{6,}\b') {
                $anydeskId = $Matches[0]
              }
            }

            if ([string]::IsNullOrWhiteSpace($anydeskId)) {
              Write-Host "ID ainda não disponível (tentativa $attempt/30)..."
              Start-Sleep -Seconds 2
            }
          }

          if ([string]::IsNullOrWhiteSpace($anydeskId)) {
            throw 'O AnyDesk foi instalado, mas não forneceu um ID após 60 segundos.'
          }

          Write-Host "AnyDesk ID obtido: $anydeskId" -ForegroundColor Yellow
          "ANYDESK_ID=$anydeskId" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

      - name: Send AnyDesk Details to Telegram
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:TELEGRAM_BOT_TOKEN) -or [string]::IsNullOrWhiteSpace($env:TELEGRAM_CHAT_ID)) {
            throw 'Configure os segredos TELEGRAM_BOT_TOKEN e TELEGRAM_CHAT_ID no repositório.'
          }

          $instanceNum = '${{ github.event.inputs.instance_number || '1' }}'
          $msgText = "<b>MÁQUINA ANYDESK PRONTA!</b>`n" +
                     "━━━━━━━━━━━━━━━━━━━━━━━━━━━━`n" +
                     "<b>Instância:</b> <code>#$instanceNum</code>`n" +
                     "<b>AnyDesk ID:</b> <code>$env:ANYDESK_ID</code>`n" +
                     "<b>Senha:</b> <code>$env:ANYDESK_PASSWORD</code>`n" +
                     "<b>Duração:</b> <code>Até 6 horas</code>`n" +
                     "━━━━━━━━━━━━━━━━━━━━━━━━━━━━"

          $payload = @{
            chat_id = $env:TELEGRAM_CHAT_ID
            text = $msgText
            parse_mode = 'HTML'
          } | ConvertTo-Json -Compress

          Invoke-RestMethod -Uri "https://api.telegram.org/bot$($env:TELEGRAM_BOT_TOKEN)/sendMessage" -Method Post -ContentType 'application/json; charset=utf-8' -Body $payload

      - name: Keep Session Alive
        shell: pwsh
        run: |
          Write-Host "`n=== SESSÃO ANYDESK ATIVA ===" -ForegroundColor Green
          $counter = 0
          while ($true) {
            $counter++
            Write-Host "Sessão ativa - Check #$counter ($(Get-Date))" -ForegroundColor Green
            Start-Sleep -Seconds 60
          }
